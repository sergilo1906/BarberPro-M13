name: Comprobacion M13

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Descargar fuente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Instalar dependencias fijadas
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci
      - name: Comprobar tipos y sintaxis
        run: npm run check
      - name: Compilar las paginas
        run: npm run build
      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
      - name: Preparar Java 21 del runner
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Preparar Chromium
        run: node app/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Probar servidor y recorridos de escritorio y movil
        run: npm run test:emuladores
